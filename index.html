<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞机大战</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #050510;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    overflow: hidden;
    color: #fff;
  }
  #game-container {
    position: relative;
    box-shadow: 0 0 40px rgba(0, 150, 255, 0.25);
    border: 2px solid #1a1a4a;
    border-radius: 6px;
    background: #0a0a2a;
  }
  canvas {
    display: block;
    border-radius: 4px;
  }
  #ui-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    display: none;
  }
  #start-screen, #gameover-screen {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(5, 5, 16, 0.85);
    backdrop-filter: blur(2px);
    pointer-events: auto;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 42px;
    color: #00eaff;
    text-shadow: 0 0 12px rgba(0, 234, 255, 0.5);
    letter-spacing: 4px;
  }
  .subtitle {
    font-size: 14px;
    color: #a0a0c0;
    margin-bottom: 24px;
    text-align: center;
    line-height: 1.6;
  }
  .btn {
    padding: 10px 32px;
    font-size: 18px;
    border: none;
    border-radius: 4px;
    background: linear-gradient(135deg, #0066ff, #00ccff);
    color: #fff;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s;
    font-family: inherit;
    font-weight: bold;
    letter-spacing: 2px;
  }
  .btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 16px rgba(0, 150, 255, 0.5);
  }
  .score-display {
    position: absolute;
    top: 10px;
    left: 14px;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 0 0 4px rgba(0,0,0,0.7);
    pointer-events: none;
  }
  .lives-display {
    position: absolute;
    top: 10px;
    right: 14px;
    font-size: 18px;
    pointer-events: none;
    text-shadow: 0 0 4px rgba(0,0,0,0.7);
  }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game" width="480" height="640"></canvas>
  <div id="ui-overlay">
    <div class="score-display">分数: <span id="score">0</span></div>
    <div class="lives-display">生命: <span id="lives">3</span></div>
  </div>
  <div id="start-screen">
    <h1>飞机大战</h1>
    <div class="subtitle">
      方向键 / WASD 移动 · 自动开火<br>
      击败敌机获得分数，小心撞击！
    </div>
    <button class="btn" id="start-btn">开始游戏</button>
  </div>
  <div id="gameover-screen" style="display:none;">
    <h1>游戏结束</h1>
    <div class="subtitle">
      最终得分: <span id="final-score">0</span><br><br>
      按 R 重新开始
    </div>
    <button class="btn" id="restart-btn">再来一局</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const finalScoreEl = document.getElementById('final-score');
const startScreen = document.getElementById('start-screen');
const gameoverScreen = document.getElementById('gameover-screen');
const uiOverlay = document.getElementById('ui-overlay');
const W = canvas.width;
const H = canvas.height;

// Audio context for simple sound effects
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) {}
  }
}
function playTone(freq, type, duration, vol=0.08) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}
function playShoot() { playTone(880, 'square', 0.06, 0.04); }
function playExplosion() { playTone(200, 'sawtooth', 0.2, 0.1); }
function playHit() { playTone(120, 'sawtooth', 0.3, 0.12); }

// Game state
let state = 'menu'; // menu, playing, gameover
let score = 0;
let lives = 3;
let frameCount = 0;
let difficulty = 1;

// Input
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === 'r' || e.key === 'R') {
    if (state === 'gameover') startGame();
  }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

// Mobile touch
let touchX = null, touchY = null;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  touchX = (e.touches[0].clientX - rect.left) * (W / rect.width);
  touchY = (e.touches[0].clientY - rect.top) * (H / rect.height);
}, {passive:false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  touchX = (e.touches[0].clientX - rect.left) * (W / rect.width);
  touchY = (e.touches[0].clientY - rect.top) * (H / rect.height);
}, {passive:false});
canvas.addEventListener('touchend', e => { touchX = null; touchY = null; });

// Entities
let player = null;
let bullets = [];
let enemies = [];
let particles = [];
let stars = [];
let powerups = [];

function createStars() {
  stars = [];
  for (let i = 0; i < 80; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      speed: 0.5 + Math.random() * 2,
      size: Math.random() * 1.5 + 0.5,
      alpha: 0.3 + Math.random() * 0.7
    });
  }
}

function spawnEnemy() {
  const t = Math.random();
  let type;
  if (t < 0.5) type = 'basic';
  else if (t < 0.8) type = 'medium';
  else type = 'fast';

  const props = {
    basic: { w: 30, h: 30, hp: 1, speed: 1.5 + difficulty * 0.3, color: '#ff4444', score: 10, shape: 'triangle' },
    medium: { w: 44, h: 40, hp: 3, speed: 1.0 + difficulty * 0.2, color: '#ff8844', score: 30, shape: 'square' },
    fast: { w: 26, h: 26, hp: 1, speed: 2.5 + difficulty * 0.4, color: '#cc44ff', score: 20, shape: 'diamond' }
  }[type];

  enemies.push({
    x: Math.random() * (W - props.w) + props.w/2,
    y: -props.h,
    w: props.w, h: props.h,
    hp: props.hp,
    maxHp: props.hp,
    speed: props.speed,
    color: props.color,
    points: props.score,
    shape: props.shape,
    vx: (Math.random() - 0.5) * 0.8
  });
}

function createExplosion(x, y, color, count=12) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.02 + Math.random() * 0.03,
      color,
      size: 2 + Math.random() * 3
    });
  }
}

function resetGame() {
  score = 0;
  lives = 3;
  difficulty = 1;
  frameCount = 0;
  bullets = [];
  enemies = [];
  particles = [];
  powerups = [];
  player = {
    x: W / 2,
    y: H - 80,
    w: 36, h: 40,
    speed: 5,
    shootTimer: 0,
    shootInterval: 12,
    invuln: 0,
    blink: 0
  };
  createStars();
  scoreEl.textContent = '0';
  livesEl.textContent = '3';
}

function startGame() {
  ensureAudio();
  resetGame();
  state = 'playing';
  startScreen.style.display = 'none';
  gameoverScreen.style.display = 'none';
  uiOverlay.style.display = 'block';
}

function endGame() {
  state = 'gameover';
  finalScoreEl.textContent = score;
  gameoverScreen.style.display = 'flex';
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

// Collision: two rectangles
function rectsCollide(a, b) {
  return Math.abs(a.x - b.x) < (a.w/2 + b.w/2) && Math.abs(a.y - b.y) < (a.h/2 + b.h/2);
}

function update() {
  if (state !== 'playing') return;
  frameCount++;

  // Difficulty scaling
  difficulty = 1 + score / 500;

  // Update stars
  stars.forEach(s => {
    s.y += s.speed;
    if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
  });

  // Player movement
  let dx = 0, dy = 0;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= 1;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
  if (keys['ArrowUp'] || keys['w'] || keys['W']) dy -= 1;
  if (keys['ArrowDown'] || keys['s'] || keys['S']) dy += 1;

  // Normalize diagonal
  if (dx !== 0 || dy !== 0) {
    const len = Math.sqrt(dx*dx + dy*dy);
    dx /= len; dy /= len;
  }
  player.x += dx * player.speed;
  player.y += dy * player.speed;

  // Touch movement override
  if (touchX !== null && touchY !== null) {
    player.x += (touchX - player.x) * 0.15;
    player.y += (touchY - player.y) * 0.15;
  }

  // Clamp
  player.x = Math.max(player.w/2, Math.min(W - player.w/2, player.x));
  player.y = Math.max(player.h/2, Math.min(H - player.h/2, player.y));

  // Invulnerability
  if (player.invuln > 0) player.invuln--;

  // Auto shoot
  player.shootTimer++;
  if (player.shootTimer >= player.shootInterval) {
    player.shootTimer = 0;
    bullets.push({ x: player.x, y: player.y - player.h/2, w: 4, h: 12, speed: 8 });
    // Side bullets at higher score
    if (score >= 200) {
      bullets.push({ x: player.x - 12, y: player.y - player.h/2 + 4, w: 3, h: 10, speed: 7 });
      bullets.push({ x: player.x + 12, y: player.y - player.h/2 + 4, w: 3, h: 10, speed: 7 });
    }
    playShoot();
  }

  // Update bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.y -= b.speed;
    if (b.y < -20) bullets.splice(i, 1);
  }

  // Spawn enemies
  const spawnRate = Math.max(20, 60 - Math.floor(difficulty * 5));
  if (frameCount % spawnRate === 0) {
    spawnEnemy();
    // More enemies as difficulty rises
    if (difficulty > 2 && frameCount % (spawnRate * 2) === 0) spawnEnemy();
    if (difficulty > 4 && frameCount % (spawnRate * 3) === 0) spawnEnemy();
  }

  // Update enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.y += e.speed;
    e.x += e.vx;
    // Bounce off walls
    if (e.x < e.w/2 || e.x > W - e.w/2) e.vx *= -1;

    if (e.y > H + 50) {
      enemies.splice(i, 1);
      continue;
    }

    // Collision with bullets
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];
      if (rectsCollide(b, e)) {
        e.hp--;
        bullets.splice(j, 1);
        if (e.hp <= 0) {
          createExplosion(e.x, e.y, e.color, 14);
          score += e.points;
          scoreEl.textContent = score;
          playExplosion();
          enemies.splice(i, 1);
        }
        break;
      }
    }

    // Collision with player
    if (enemies[i] && player.invuln <= 0 && rectsCollide(player, enemies[i])) {
      lives--;
      livesEl.textContent = lives;
      player.invuln = 120; // 2 seconds at 60fps
      createExplosion(player.x, player.y, '#00eaff', 20);
      createExplosion(enemies[i].x, enemies[i].y, enemies[i].color, 14);
      playHit();
      enemies.splice(i, 1);
      if (lives <= 0) endGame();
    }
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = '#0a0a2a';
  ctx.fillRect(0, 0, W, H);

  // Stars
  stars.forEach(s => {
    ctx.globalAlpha = s.alpha * 0.8;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  if (state !== 'playing' && state !== 'gameover') {
    return;
  }

  // Player
  if (player) {
    if (player.invuln <= 0 || Math.floor(frameCount / 4) % 2 === 0) {
      drawPlayer(player.x, player.y);
    }
  }

  // Bullets
  ctx.fillStyle = '#ffeb3b';
  ctx.shadowColor = '#ffeb3b';
  ctx.shadowBlur = 6;
  bullets.forEach(b => {
    ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h);
  });
  ctx.shadowBlur = 0;

  // Enemies
  enemies.forEach(e => drawEnemy(e));

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Side borders glow
  ctx.fillStyle = 'rgba(0, 100, 255, 0.06)';
  ctx.fillRect(0, 0, 6, H);
  ctx.fillRect(W-6, 0, 6, H);
}

function drawPlayer(x, y) {
  ctx.save();
  ctx.translate(x, y);

  // Engine glow
  ctx.shadowColor = '#00eaff';
  ctx.shadowBlur = 12;
  ctx.fillStyle = 'rgba(0, 234, 255, 0.3)';
  ctx.beginPath();
  ctx.moveTo(0, 18);
  ctx.lineTo(-6, 28 + Math.random()*4);
  ctx.lineTo(6, 28 + Math.random()*4);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;

  // Body
  ctx.fillStyle = '#ddeeff';
  ctx.beginPath();
  ctx.moveTo(0, -20);
  ctx.lineTo(-14, 16);
  ctx.lineTo(0, 10);
  ctx.lineTo(14, 16);
  ctx.closePath();
  ctx.fill();

  // Wings detail
  ctx.fillStyle = '#00aaff';
  ctx.beginPath();
  ctx.moveTo(-14, 16);
  ctx.lineTo(-18, 8);
  ctx.lineTo(-6, 4);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(14, 16);
  ctx.lineTo(18, 8);
  ctx.lineTo(6, 4);
  ctx.closePath();
  ctx.fill();

  // Cockpit
  ctx.fillStyle = '#00eaff';
  ctx.beginPath();
  ctx.save();
  ctx.translate(0, -4);
  ctx.scale(1, 2);
  ctx.arc(0, 0, 3, 0, Math.PI*2);
  ctx.restore();
  ctx.fill();

  ctx.restore();
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.fillStyle = e.color;
  ctx.shadowColor = e.color;
  ctx.shadowBlur = 8;

  if (e.shape === 'triangle') {
    ctx.beginPath();
    ctx.moveTo(0, e.h/2);
    ctx.lineTo(-e.w/2, -e.h/2);
    ctx.lineTo(e.w/2, -e.h/2);
    ctx.closePath();
    ctx.fill();
  } else if (e.shape === 'square') {
    ctx.fillRect(-e.w/2, -e.h/2, e.w, e.h);
    // HP bar for medium
    if (e.maxHp > 1) {
      ctx.shadowBlur = 0;
      const bw = e.w;
      const bh = 4;
      const by = -e.h/2 - 8;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(-bw/2, by, bw, bh);
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(-bw/2, by, bw * (e.hp / e.maxHp), bh);
    }
  } else if (e.shape === 'diamond') {
    ctx.beginPath();
    ctx.moveTo(0, -e.h/2);
    ctx.lineTo(e.w/2, 0);
    ctx.lineTo(0, e.h/2);
    ctx.lineTo(-e.w/2, 0);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

function loop() {
  try {
    update();
    draw();
  } catch (e) {
    console.error(e);
  }
  requestAnimationFrame(loop);
}

// Start render loop
requestAnimationFrame(loop);
</script>
</body>
</html>
